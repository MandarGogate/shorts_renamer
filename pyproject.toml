[project]
name = "shortssync"
version = "2.0.0"
description = "Audio matching and Shazam-powered renaming for short-form video management"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "moviepy>=2.0.0",
    "yt-dlp>=2023.0.0",
]

[project.optional-dependencies]
web = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.9.0",
    "werkzeug>=2.0.0",
]
shazam = ["shazamio>=0.6.0"]
dev = ["pytest>=7.0", "pytest-timeout>=2.0", "ruff>=0.4.0"]
all = ["shortssync[web,shazam,dev]"]

[project.scripts]
shortssync-cli = "cli:main"
shortssync-web = "web_backend:main"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "integration: tests that shell out to ffmpeg/fpcalc",
    "network: tests that require network access (e.g. Shazam)",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line length) is reported but not enforced project-wide yet.
ignore = ["E501"]
